<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#ebf8ff"/>
  <rect x="0" y="320" width="800" height="180" fill="#c6f6d5"/>
  <!-- Clean gutter -->
  <rect x="50" y="280" width="700" height="40" fill="#2b6cb0" rx="4"/>
  <!-- Clean downspouts -->
  <rect x="80" y="320" width="18" height="100" fill="#2b6cb0"/>
  <rect x="400" y="320" width="18" height="100" fill="#2b6cb0"/>
  <rect x="700" y="320" width="18" height="100" fill="#2b6cb0"/>
  <!-- House suggestion -->
  <rect x="150" y="100" width="500" height="180" fill="#edf2f7" stroke="#a0aec0" stroke-width="2"/>
  <polygon points="150,100 400,30 650,100" fill="#e53e3e"/>
  <text x="400" y="200" text-anchor="middle" fill="#2d3748" font-family="system-ui,sans-serif" font-size="28" font-weight="600">AFTER</text>
  <text x="400" y="240" text-anchor="middle" fill="#4a5568" font-family="system-ui,sans-serif" font-size="18">Clean, Functional Gutter System</text>
</svg>
