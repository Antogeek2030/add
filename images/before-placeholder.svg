  <!-- Clogged gutter representation -->
  <rect x="50" y="280" width="700" height="40" fill="#718096" rx="4"/>
  <rect x="60" y="250" width="30" height="40" fill="#48bb78"/>
  <rect x="120" y="240" width="40" height="50" fill="#38a169"/>
  <rect x="200" y="255" width="25" height="35" fill="#48bb78"/>
  <rect x="280" y="245" width="35" height="45" fill="#2f855a"/>
